<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · SYK 的博客</title>
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="assets/favicon.svg" alt="logo" width="34" height="34">
        <span>SYK 的博客</span>
      </a>
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="downloads.html">下载</a>
        <a href="admin.html">管理</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 未配置提示 -->
    <div id="not-configured" class="warning hidden">
      <strong>后端尚未配置</strong>
      <p>请先完成 <code>README.md</code> 里的 Supabase 配置步骤，把地址和密钥填进 <code>assets/config.js</code>。</p>
    </div>

    <!-- 登录 -->
    <section id="login-box" class="card auth-card">
      <h1>管理员登录</h1>
      <form id="login-form">
        <label>邮箱
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>密码
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn primary" id="login-btn">登录</button>
      </form>
      <p class="hint">账号在 Supabase 后台（Authentication → Users）里创建。</p>
    </section>

    <!-- 后台 -->
    <section id="admin-box" class="hidden">
      <div class="admin-head">
        <h1>后台管理</h1>
        <div class="admin-head-right">
          <span id="whoami" class="muted"></span>
          <button class="btn" id="logout-btn">退出登录</button>
        </div>
      </div>

      <div class="admin-grid">
        <div class="card">
          <h2>发布文章</h2>
          <form id="article-form">
            <label>标题
              <input type="text" id="a-title" required>
            </label>
            <label>分类
              <select id="a-category">
                <option value="tech">技术</option>
                <option value="life">生活</option>
                <option value="study">学习</option>
              </select>
            </label>
            <label>摘要（可选）
              <input type="text" id="a-summary">
            </label>
            <label>封面图（可选）
              <input type="file" id="a-cover" accept="image/*">
            </label>
            <label>正文（支持 Markdown）
              <textarea id="a-content" rows="10" required placeholder="# 标题&#10;&#10;正文内容，支持 **加粗**、`代码`、链接等 Markdown 语法。"></textarea>
            </label>
            <button type="submit" class="btn primary" id="a-submit">发布文章</button>
          </form>
        </div>

        <div class="card">
          <h2>上传软件 / 文件</h2>
          <form id="file-form">
            <label>名称
              <input type="text" id="f-name" required>
            </label>
            <label>版本（可选）
              <input type="text" id="f-version" placeholder="如 1.0.0">
            </label>
            <label>描述（可选）
              <input type="text" id="f-description">
            </label>
            <label>选择文件
              <input type="file" id="f-file" required>
            </label>
            <button type="submit" class="btn primary" id="f-submit">上传</button>
          </form>
          <p class="hint">文件会存到 Supabase Storage（免费 1GB）。单个文件建议 ≤ 100MB。</p>
        </div>
      </div>

      <div class="card">
        <h2>我的文章</h2>
        <div id="my-posts" class="manage-list"></div>
      </div>

      <div class="card">
        <h2>我的文件</h2>
        <div id="my-files" class="manage-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 SYK · 由 GitHub Pages + Supabase 驱动</div>
  </footer>

  <script src="assets/config.js"></script>
  <script type="module" src="assets/admin.js"></script>
</body>
</html>
